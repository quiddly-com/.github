name: "Close stale pull requests (all repos)"

on:
  schedule:
    - cron: "0 3 * * *" # Runs every day at 03:00 UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  close-stale-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Close stale PRs across all org repos
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_PAT }}
          script: |
            const org = 'quiddly-com';
            const staleDays = 14;
            const closeDays = 2;
            const now = new Date();

            const repos = await github.paginate(github.rest.repos.listForOrg, {
              org,
              type: 'all',
            });

            for (const repo of repos) {
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner: org,
                repo: repo.name,
                state: 'open',
              });

              for (const pr of pulls) {
                const labels = pr.labels.map(l => l.name);
                if (labels.includes('keep-open')) continue;

                const author = pr.user.login;
                const updatedAt = new Date(pr.updated_at);
                const daysInactive = (now - updatedAt) / (1000 * 60 * 60 * 24);

                // Close PRs that were marked stale and remained inactive
                if (daysInactive > staleDays + closeDays && labels.includes('stale')) {
                  await github.rest.issues.createComment({
                    owner: org,
                    repo: repo.name,
                    issue_number: pr.number,
                    body: `@${author} Closing this pull request due to prolonged inactivity.\nIf you would like to continue working on it, feel free to reopen or open a new PR.`,
                  });
                  await github.rest.pulls.update({
                    owner: org,
                    repo: repo.name,
                    pull_number: pr.number,
                    state: 'closed',
                  });
                  core.info(`Closed PR #${pr.number} in ${repo.name}`);
                }
                // Mark inactive PRs as stale
                else if (daysInactive > staleDays && !labels.includes('stale')) {
                  await github.rest.issues.addLabels({
                    owner: org,
                    repo: repo.name,
                    issue_number: pr.number,
                    labels: ['stale'],
                  });
                  await github.rest.issues.createComment({
                    owner: org,
                    repo: repo.name,
                    issue_number: pr.number,
                    body: `@${author} This pull request has been inactive for a while.\nPlease comment or push new commits to keep it open.\nOtherwise, it will be closed in **2 days** due to inactivity.`,
                  });
                  core.info(`Marked PR #${pr.number} in ${repo.name} as stale`);
                }
                // Remove stale label if PR was updated after being marked stale
                else if (daysInactive <= staleDays && labels.includes('stale')) {
                  await github.rest.issues.removeLabel({
                    owner: org,
                    repo: repo.name,
                    issue_number: pr.number,
                    name: 'stale',
                  });
                  core.info(`Removed stale label from PR #${pr.number} in ${repo.name}`);
                }
              }
            }
