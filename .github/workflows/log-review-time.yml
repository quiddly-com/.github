name: Log review time
on:
  workflow_call:

jobs:
  logtime:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Compute secret suffix
        id: who
        env:
          LOGIN: ${{ github.event.review.user.login }}
        run: echo "key=$(echo "$LOGIN" | tr '[:lower:]-' '[:upper:]_')" >> "$GITHUB_OUTPUT"

      - name: Log time to Jira
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets[format('JIRA_EMAIL_{0}', steps.who.outputs.key)] }}
          JIRA_TOKEN: ${{ secrets[format('JIRA_TOKEN_{0}', steps.who.outputs.key)] }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ github.event.review.user.login }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$JIRA_TOKEN" ]; then
            echo "No Jira token for $REVIEWER, skipping"
            exit 0
          fi

          TICKET=$(echo "$PR_TITLE" | grep -oE 'QDLY-[0-9]+' | head -1)
          if [ -n "$TICKET" ]; then
            echo "Ticket $TICKET found in PR title"
          else
            TICKET=$(echo "$PR_BODY" | grep -oE 'QDLY-[0-9]+' | head -1)
            if [ -n "$TICKET" ]; then
              echo "Ticket $TICKET found in PR body"
            else
              TICKET=$(echo "$PR_BRANCH" | grep -oE 'QDLY-[0-9]+' | head -1)
              if [ -n "$TICKET" ]; then
                echo "Ticket $TICKET found in branch name"
              fi
            fi
          fi

          if [ -z "$TICKET" ]; then
            echo "No QDLY ticket found in title, body, or branch name; skipping"
            exit 0
          fi

          CHANGED_FILES=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.changed_files')
          echo "Changed files: $CHANGED_FILES"

          if [ "$CHANGED_FILES" -le 6 ]; then
            TIME="15m"
          else
            TIME="30m"
          fi

          curl -fsS -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -X POST -H "Content-Type: application/json" \
            "$JIRA_URL/rest/api/3/issue/$TICKET/worklog" \
            -d "{
              \"timeSpent\": \"$TIME\",
              \"comment\": {
                \"type\": \"doc\",
                \"version\": 1,
                \"content\": [{
                  \"type\": \"paragraph\",
                  \"content\": [{\"type\": \"text\", \"text\": \"PR review #$PR_NUMBER\"}]
                }]
              }
            }"
